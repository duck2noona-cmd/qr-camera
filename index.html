<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR 촬영기</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #f5f5f7;
            margin: 0;
            padding: 16px;
        }
        h2 { color: #1d1d1f; margin: 10px 0 4px 0; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            max-width: 400px;
            margin: 10px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: left;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video { width: 100%; display: block; }
        .status {
            margin: 12px 0;
            font-weight: bold;
            color: #007aff;
            min-height: 24px;
            text-align: center;
            word-break: break-all;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 8px auto;
            padding: 14px 0;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background: #007aff; }
        .btn-next { background: #34c759; display: none; }
        .btn-danger { background: #ff3b30; padding: 6px 12px; font-size: 12px; width: auto; margin: 0; }
        
        .folder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .folder-item.active {
            border-color: #007aff;
            background: #f0f8ff;
        }
        input[type="text"] {
            width: calc(100% - 90px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px; /* 사파리 자동 확대 방지 */
        }
        .flex-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
        .error-msg { color: #ff3b30; font-size: 13px; margin-top: 6px; }
    </style>
</head>
<body>

    <h2>QR 촬영기</h2>

    <div class="card">
        <strong style="display:block; margin-bottom:8px;">📁 작업 폴더 선택 및 생성</strong>
        <div class="flex-row" style="margin-bottom: 8px;">
            <input type="text" id="newFolderName" placeholder="새 작업 폴더명 입력">
            <button type="button" class="btn btn-primary" style="width:80px; margin:0;" onclick="createFolder()">생성</button>
        </div>
        <div id="errorBox" class="error-msg"></div>
        <div id="folderList" style="margin-top: 12px;">폴더 목록을 불러오는 중...</div>
    </div>

    <div id="scannerSection" style="display: none;">
        <div class="camera-container">
            <video id="video" playsinline></video>
        </div>

        <div class="status" id="status">카메라 준비 중...</div>

        <button type="button" id="nextBtn" class="btn btn-next" onclick="resumeScanning()">
            📸 촬영하기
        </button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let deviceId = localStorage.getItem('qr_device_id');
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('qr_device_id', deviceId);
        }

        let currentFolderId = null;
        let isPaused = false;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const nextBtn = document.getElementById('nextBtn');
        const errorBox = document.getElementById('errorBox');

        document.addEventListener("DOMContentLoaded", fetchFolders);

        async function fetchFolders() {
            errorBox.innerText = "";
            try {
                const res = await fetch(`/api/folders?deviceId=${deviceId}`);
                if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
                const folders = await res.json();
                
                const listEl = document.getElementById('folderList');
                if (!Array.isArray(folders) || folders.length === 0) {
                    listEl.innerHTML = "<p style='color:#8e8e93; font-size:13px;'>생성된 작업 폴더가 없습니다.</p>";
                    return;
                }

                listEl.innerHTML = folders.map(f => `
                    <div class="folder-item ${f.id === currentFolderId ? 'active' : ''}" onclick="selectFolder('${f.id}', '${f.name}')">
                        <div>
                            <strong>📂 ${f.name}</strong>
                            <div style="font-size:12px; color:#8e8e93;">사진 ${f.fileCount || 0}장</div>
                        </div>
                        <button type="button" class="btn btn-danger" onclick="event.stopPropagation(); deleteFolder('${f.id}')">삭제</button>
                    </div>
                `).join('');
            } catch (err) {
                errorBox.innerText = "폴더 목록 불러오기 실패: " + err.message;
            }
        }

        async function createFolder() {
            errorBox.innerText = "";
            const input = document.getElementById('newFolderName');
            const name = input.value.trim();
            if (!name) return alert("폴더 이름을 입력해주세요.");

            try {
                const res = await fetch(`/api/folders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, name })
                });

                if (!res.ok) throw new Error(`생성 실패 (${res.status})`);

                input.value = '';
                fetchFolders();
            } catch (err) {
                errorBox.innerText = "폴더 생성 오류: " + err.message;
            }
        }

        async function deleteFolder(folderId) {
            if (!confirm("해당 폴더를 삭제하시겠습니까?")) return;

            try {
                await fetch(`/api/folders/${folderId}`, { method: 'DELETE' });
                if (currentFolderId === folderId) {
                    currentFolderId = null;
                    document.getElementById('scannerSection').style.display = 'none';
                }
                fetchFolders();
            } catch (err) {
                errorBox.innerText = "폴더 삭제 오류: " + err.message;
            }
        }

        function selectFolder(folderId, folderName) {
            currentFolderId = folderId;
            document.getElementById('scannerSection').style.display = 'block';
            statusText.innerText = `[${folderName}] 작업 중... QR 코드를 비춰주세요.`;
            fetchFolders();
            startCamera();
        }

        function startCamera() {
            if (video.srcObject) return;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then((stream) => {
                    video.srcObject = stream;
                    video.setAttribute("playsinline", true);
                    video.play();
                    requestAnimationFrame(scanQR);
                })
                .catch(() => statusText.innerText = "카메라를 켤 수 없습니다.");
        }

        function scanQR() {
            if (!isPaused && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code && code.data.trim() !== "") {
                    isPaused = true;
                    uploadPhotoToServer(code.data);
                    return;
                }
            }
            requestAnimationFrame(scanQR);
        }

        async function uploadPhotoToServer(qrValue) {
            statusText.innerText = "서버로 사진 전송 중...";
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.9);

            try {
                const res = await fetch(`/api/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        folderId: currentFolderId,
                        qrValue: qrValue,
                        image: imageDataUrl
                    })
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || "저장 실패");

                statusText.innerText = `✅ 저장 완료: ${result.fileName}`;
                nextBtn.style.display = 'block';
                fetchFolders();
            } catch (err) {
                statusText.innerText = "❌ 서버 저장 실패: " + err.message;
                nextBtn.style.display = 'block';
            }
        }

        function resumeScanning() {
            nextBtn.style.display = 'none';
            statusText.innerText = "다음 QR 코드를 비춰주세요...";
            isPaused = false;
            requestAnimationFrame(scanQR);
        }
    </script>
</body>
</html>
