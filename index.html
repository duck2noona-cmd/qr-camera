<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR 촬영기</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #f5f5f7;
            margin: 0;
            padding: 16px;
        }
        h2 { color: #1d1d1f; margin: 10px 0 4px 0; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            max-width: 400px;
            margin: 10px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: left;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video { width: 100%; display: block; }
        .status {
            margin: 12px 0;
            font-weight: bold;
            color: #007aff;
            min-height: 24px;
            text-align: center;
            word-break: break-all;
        }
        .btn {
            display: inline-block;
            width: 100%;
            max-width: 400px;
            margin: 6px auto;
            padding: 12px 0;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background: #007aff; }
        .btn-success { background: #34c759; }
        .btn-secondary { background: #8e8e93; }
        .btn-danger { background: #ff3b30; }
        .btn-sm { padding: 6px 10px; font-size: 12px; width: auto; margin: 0; }
        
        .folder-item {
            background: #fafafa;
            border: 1px solid #e5e5ea;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .folder-actions {
            display: flex;
            gap: 6px;
        }
        input[type="text"] {
            width: calc(100% - 85px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .flex-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
        .error-msg { color: #ff3b30; font-size: 13px; margin-top: 6px; }
        
        .info-bar {
            background: #e5f1ff;
            color: #007aff;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 400px;
            margin: 0 auto 12px auto;
        }
    </style>
</head>
<body>

    <h2>QR 촬영기</h2>

    <!-- [화면 1] 폴더 리스트 & 생성 화면 -->
    <div id="homeSection">
        <div class="card">
            <strong style="display:block; margin-bottom:8px;">📁 새 작업 폴더 생성</strong>
            <div class="flex-row" style="margin-bottom: 8px;">
                <input type="text" id="newFolderName" placeholder="폴더명 입력">
                <button type="button" class="btn btn-primary" style="width:75px; margin:0;" onclick="createFolder()">생성</button>
            </div>
            <div id="errorBox" class="error-msg"></div>
        </div>

        <div class="card">
            <strong style="display:block; margin-bottom:12px;">📂 폴더 목록</strong>
            <div id="folderList"></div>
        </div>
    </div>

    <!-- [화면 2] QR 카메라 스캔 화면 -->
    <div id="scannerSection" style="display: none;">
        <div class="info-bar">
            <span id="scannerTitle">📂 - (사진 0장)</span>
            <button type="button" class="btn btn-secondary btn-sm" onclick="goBackToHome()">⬅ 목록으로</button>
        </div>

        <div class="camera-container">
            <video id="video" playsinline></video>
        </div>

        <div class="status" id="status">카메라 준비 중...</div>

        <button type="button" id="nextBtn" class="btn btn-success" style="display:none;" onclick="resumeScanning()">
            📸 다음 촬영하기
        </button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let folders = JSON.parse(localStorage.getItem('qr_folders') || '[]');
        let currentFolderId = null;
        let isPaused = false;
        let streamObject = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const nextBtn = document.getElementById('nextBtn');
        const errorBox = document.getElementById('errorBox');

        document.addEventListener("DOMContentLoaded", renderFolders);

        function renderFolders() {
            const listEl = document.getElementById('folderList');
            if (folders.length === 0) {
                listEl.innerHTML = "<p style='color:#8e8e93; font-size:13px; text-align:center;'>생성된 작업 폴더가 없습니다.</p>";
                return;
            }

            listEl.innerHTML = folders.map(f => {
                const count = f.photos ? f.photos.length : 0;
                return `
                    <div class="folder-item">
                        <div class="folder-header">
                            <div>
                                <strong>📂 ${f.name}</strong>
                                <span style="font-size:12px; color:#8e8e93; margin-left:4px;">(${count}장)</span>
                            </div>
                            <button type="button" class="btn btn-primary btn-sm" onclick="openScanner('${f.id}')">📷 촬영하기</button>
                        </div>
                        <div class="folder-actions">
                            <button type="button" class="btn btn-success btn-sm" style="flex:1;" onclick="downloadZip('${f.id}')" ${count === 0 ? 'disabled style="opacity:0.5;"' : ''}>📦 ZIP 다운/공유</button>
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteFolder('${f.id}')">삭제</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function createFolder() {
            errorBox.innerText = "";
            const input = document.getElementById('newFolderName');
            const name = input.value.trim();
            if (!name) return alert("폴더 이름을 입력해주세요.");

            const newFolder = {
                id: 'f_' + Date.now(),
                name: name,
                photos: []
            };

            folders.push(newFolder);
            saveFolders();

            input.value = '';
            renderFolders();
        }

        function deleteFolder(folderId) {
            if (!confirm("해당 폴더와 촬영된 사진이 모두 삭제됩니다. 계속하시겠습니까?")) return;

            folders = folders.filter(f => f.id !== folderId);
            saveFolders();
            renderFolders();
        }

        async function downloadZip(folderId) {
            const targetFolder = folders.find(f => f.id === folderId);
            if (!targetFolder || !targetFolder.photos || targetFolder.photos.length === 0) {
                return alert("다운로드할 사진이 없습니다.");
            }

            const zip = new JSZip();
            const imgFolder = zip.folder(targetFolder.name);

            targetFolder.photos.forEach(p => {
                const base64Data = p.image.replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
                imgFolder.file(p.fileName, base64Data, { base64: true });
            });

            const content = await zip.generateAsync({ type: "blob" });
            const zipFileName = `${targetFolder.name}.zip`;

            if (navigator.canShare && navigator.canShare({ files: [new File([content], zipFileName, { type: 'application/zip' })] })) {
                try {
                    const file = new File([content], zipFileName, { type: 'application/zip' });
                    await navigator.share({
                        files: [file],
                        title: targetFolder.name,
                        text: `${targetFolder.name} 폴더 사진 모음`
                    });
                    return;
                } catch (err) {
                    console.log("공유 취소 또는 오류", err);
                }
            }

            const a = document.createElement("a");
            a.href = URL.createObjectURL(content);
            a.download = zipFileName;
            a.click();
        }

        function openScanner(folderId) {
            currentFolderId = folderId;
            document.getElementById('homeSection').style.display = 'none';
            document.getElementById('scannerSection').style.display = 'block';

            updateScannerHeader();
            startCamera();
        }

        function updateScannerHeader() {
            const targetFolder = folders.find(f => f.id === currentFolderId);
            if (targetFolder) {
                const count = targetFolder.photos ? targetFolder.photos.length : 0;
                document.getElementById('scannerTitle').innerText = `📂 ${targetFolder.name} (${count}장)`;
            }
        }

        function goBackToHome() {
            stopCamera();
            document.getElementById('scannerSection').style.display = 'none';
            document.getElementById('homeSection').style.display = 'block';
            renderFolders();
        }

        function startCamera() {
            isPaused = false;
            nextBtn.style.display = 'none';
            statusText.innerText = "QR 코드를 비춰주세요...";

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then((stream) => {
                    streamObject = stream;
                    video.srcObject = stream;
                    video.setAttribute("playsinline", true);
                    video.play();
                    requestAnimationFrame(scanQR);
                })
                .catch(() => statusText.innerText = "카메라를 켤 수 없습니다.");
        }

        function stopCamera() {
            if (streamObject) {
                streamObject.getTracks().forEach(track => track.stop());
                streamObject = null;
            }
            video.srcObject = null;
        }

        function scanQR() {
            if (!isPaused && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code && code.data.trim() !== "") {
                    isPaused = true;
                    uploadPhotoToServer(code.data);
                    return;
                }
            }
            if (streamObject) {
                requestAnimationFrame(scanQR);
            }
        }

        async function uploadPhotoToServer(qrValue) {
            statusText.innerText = "서버로 사진 전송 중...";
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const targetFolder = folders.find(f => f.id === currentFolderId);

            try {
                const res = await fetch(`/api/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        folderName: targetFolder.name,
                        qrValue: qrValue,
                        image: imageDataUrl
                    })
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || "저장 실패");

                if (!targetFolder.photos) targetFolder.photos = [];
                
                const rawName = qrValue.replace(/[^a-zA-Z0-9가-힣_-]/g, "_");
                const sameCount = targetFolder.photos.filter(p => p.rawName === rawName).length;
                
                let fileName = `${rawName}.jpg`;
                if (sameCount === 1) fileName = `${rawName}_(중복).jpg`;
                else if (sameCount > 1) fileName = `${rawName}_(중복${sameCount}).jpg`;

                targetFolder.photos.push({
                    rawName: rawName,
                    fileName: fileName,
                    image: imageDataUrl
                });

                saveFolders();
                updateScannerHeader();

                statusText.innerText = `✅ 저장 완료: ${fileName}`;
                nextBtn.style.display = 'block';
            } catch (err) {
                statusText.innerText = "❌ 저장 실패: " + err.message;
                nextBtn.style.display = 'block';
            }
        }

        function resumeScanning() {
            nextBtn.style.display = 'none';
            statusText.innerText = "다음 QR 코드를 비춰주세요...";
            isPaused = false;
            requestAnimationFrame(scanQR);
        }

        function saveFolders() {
            localStorage.setItem('qr_folders', JSON.stringify(folders));
        }
    </script>
</body>
</html>
