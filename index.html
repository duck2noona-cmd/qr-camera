<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 수동 연속 촬영기</title>
    <!-- QR 인식 및 ZIP 압축 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #f5f5f7;
            margin: 0;
            padding: 16px;
        }
        h2 { color: #1d1d1f; margin: 10px 0; }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }
        video { width: 100%; display: block; }
        .status {
            margin: 12px 0;
            font-weight: bold;
            color: #007aff;
            min-height: 24px;
        }
        .count-badge {
            display: inline-block;
            background: #34c759;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
            padding: 16px 0;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            font-size: 17px;
            border: none;
            cursor: pointer;
        }
        .btn-next {
            background: #34c759;
            display: none; /* 기본 숨김 */
        }
        .btn-zip {
            background: #007aff;
        }
        .btn-zip:disabled {
            background: #c7c7cc;
        }
        .list-container {
            max-width: 400px;
            margin: 20px auto 0;
            text-align: left;
        }
        .photo-item {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .photo-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 12px;
        }
        .photo-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .photo-name {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge-dup {
            color: #ff9500;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>QR 수동 연속 촬영기</h2>
    <div class="count-badge">촬영된 사진: <span id="photoCount">0</span>장</div>

    <!-- 카메라 화면 -->
    <div class="camera-container">
        <video id="video" playsinline></video>
    </div>

    <div class="status" id="status">카메라 권한 확인 중...</div>

    <!-- 다음 버튼 & ZIP 다운로드 버튼 -->
    <button id="nextBtn" class="btn btn-next" onclick="resumeScanning()">
        📸 다음 촬영하기
    </button>

    <button id="zipBtn" class="btn btn-zip" onclick="downloadAllAsZip()" disabled>
        📦 사진 전체 ZIP 다운로드 (0장)
    </button>

    <!-- 촬영 목록 -->
    <div class="list-container" id="photoList"></div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const photoCountText = document.getElementById('photoCount');
        const nextBtn = document.getElementById('nextBtn');
        const zipBtn = document.getElementById('zipBtn');
        const photoList = document.getElementById('photoList');

        const capturedPhotos = []; 
        let isPaused = false; // 스캔 일시정지 상태 변수

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" } 
        }).then((stream) => {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            statusText.innerText = "QR 코드를 비춰주세요...";
            requestAnimationFrame(scanQR);
        }).catch((err) => {
            statusText.innerText = "카메라를 켤 수 없습니다.";
        });

        function scanQR() {
            if (!isPaused && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code && code.data.trim() !== "") {
                    // QR 인식 성공 시 스캔 정지 및 '다음' 버튼 띄우기
                    isPaused = true;
                    takeSnapshot(code.data);
                    return;
                }
            }
            requestAnimationFrame(scanQR);
        }

        // 중복 파일명 처리 및 사진 저장 함수
        function takeSnapshot(qrValue) {
            const rawName = qrValue.replace(/[^a-zA-Z0-9가-힣_-]/g, "_");
            
            // 동일한 원본 QR값 개수 확인 (중복 체크)
            const sameCount = capturedPhotos.filter(p => p.originalQr === rawName).length;
            
            let finalFileName = "";
            let isDuplicate = false;

            if (sameCount === 0) {
                finalFileName = `${rawName}.jpg`;
            } else if (sameCount === 1) {
                finalFileName = `${rawName}_(중복).jpg`;
                isDuplicate = true;
            } else {
                finalFileName = `${rawName}_(중복${sameCount - 1}).jpg`;
                isDuplicate = true;
            }

            const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.9);

            // 데이터 배열 저장
            capturedPhotos.push({
                originalQr: rawName,
                fileName: finalFileName,
                dataUrl: jpegDataUrl
            });

            // UI 업데이트
            photoCountText.innerText = capturedPhotos.length;
            zipBtn.innerText = `📦 사진 전체 ZIP 다운로드 (${capturedPhotos.length}장)`;
            zipBtn.disabled = false;
            
            if (isDuplicate) {
                statusText.innerHTML = `⚠️ 인식 성공 <span class="badge-dup">(중복 감지: ${finalFileName})</span>`;
            } else {
                statusText.innerText = `📸 인식 성공: ${finalFileName}`;
            }

            // '다음' 버튼 보여주기
            nextBtn.style.display = 'block';

            // 목록 표시 추가
            const item = document.createElement('div');
            item.className = 'photo-item';
            item.innerHTML = `
                <img src="${jpegDataUrl}">
                <div class="photo-info">
                    <div class="photo-name">${finalFileName}</div>
                </div>
            `;
            photoList.insertBefore(item, photoList.firstChild);
        }

        // '다음 촬영하기' 버튼 클릭 시 작동
        function resumeScanning() {
            nextBtn.style.display = 'none';
            statusText.innerText = "다음 QR 코드를 비춰주세요...";
            isPaused = false;
            requestAnimationFrame(scanQR);
        }

        // ZIP 다운로드
        async function downloadAllAsZip() {
            if (capturedPhotos.length === 0) return;

            statusText.innerText = "압축 파일 생성 중...";
            const zip = new JSZip();

            capturedPhotos.forEach((photo) => {
                const base64Data = photo.dataUrl.split(',')[1];
                zip.file(photo.fileName, base64Data, { base64: true });
            });

            const content = await zip.generateAsync({ type: "blob" });
            const zipUrl = URL.createObjectURL(content);

            const a = document.createElement('a');
            a.href = zipUrl;
            a.download = `QR_Photos_${new Date().getTime()}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            statusText.innerText = "ZIP 다운로드가 시작되었습니다!";
        }
    </script>
</body>
</html>
